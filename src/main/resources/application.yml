spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: safesail-collector

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/safesail}
    username: ${DB_USERNAME:safesail}
    password: ${DB_PASSWORD:safesail}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6381}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: ${APP_PORT:8080}

# =========================
# 국립해양조사원(KHOA)
# =========================
khoa:
  api-key: ${KHOA_API_KEY}
  base-url: ${KHOA_API_URL}

# =========================
# 기상청(KMA)
# =========================
kma:
  service-key: ${KMA_API_KEY}
  base-url: ${KMA_API_URL}

# =========================
# 국립해양조사원 수심
# =========================
depth:
  api-key: ${DEPTH_API_KEY}
  base-url: ${DEPTH_API_URL:https://apis.data.go.kr/1192136/waterDepth/GetWaterDepthApiService}
  #수심 API의 페이지당 최대 조회 개수
  page-size: 300

# =========================
# Marine Simulation Area
# =========================
simulation:
  marine:
    #원점으로 사용하는 거제도 부이 좌표 (향후 수정 사항)
    origin-lat: ${GEOJE_BUOY_LAT:34.7667}
    origin-lon: ${GEOJE_BUOY_LON:128.9000}
    #거제도 부이 좌표 기준 반지름 5km
    radius-meters: 5000
    #수심 API 갱신 주기, 변하지 않는 API이기 때문에 7일로 잡음
    depth-cache-ttl: ${DEPTH_CACHE_TTL:168h}
    #API 장애 발생 시 재호출 대기 시간
    depth-refresh-retry-delay: ${DEPTH_REFRESH_RETRY_DELAY:1h}

# =========================
# Weather Scheduler
# =========================
weather:
  cache-ttl-minutes: 60
  scheduler-cron: "* * * * * *"

logging:
  level:
    root: INFO
    com.safesail: DEBUG
